name: Build
permissions: write-all
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release"
        required: false
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux GNU
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,      output: linux-amd64-gnu    }
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu,        output: linux-386-gnu      }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu,     output: linux-arm64-gnu    }
          - { os: ubuntu-latest, target: riscv64gc-unknown-linux-gnu,   output: linux-riscv64-gnu  }
          - { os: ubuntu-latest, target: loongarch64-unknown-linux-gnu, output: linux-loong64-gnu }

          # Linux musl (static)
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl,     output: linux-amd64-musl   }
          - { os: ubuntu-latest, target: i686-unknown-linux-musl,       output: linux-386-musl     }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl,    output: linux-arm64-musl   }
          - { os: ubuntu-latest, target: riscv64gc-unknown-linux-musl,   output: linux-riscv64-musl }
          - { os: ubuntu-latest, target: loongarch64-unknown-linux-musl, output: linux-loong64-musl }

          # macOS — native runner, add both targets for universal coverage
          - { os: macos-latest, target: x86_64-apple-darwin,            output: darwin-amd64   }
          - { os: macos-latest, target: aarch64-apple-darwin,           output: darwin-arm64   }

          # Windows — native MSVC runner (required for the `windows` crate)
          - { os: windows-latest, target: x86_64-pc-windows-msvc,      output: windows-amd64  }
          - { os: windows-latest, target: i686-pc-windows-msvc,        output: windows-386    }
          - { os: windows-latest, target: aarch64-pc-windows-msvc,     output: windows-arm64  }

    steps:
      - uses: actions/checkout@v6

      - name: Apply release package version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.version, 'v'))
        shell: bash
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"

          if [ -n "$INPUT_VERSION" ]; then
            CLEAN_VERSION="${INPUT_VERSION#v}"
            if [[ ! "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version format: $INPUT_VERSION"
              exit 1
            fi
            RELEASE_VERSION="$CLEAN_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            CLEAN_VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version format: $GITHUB_REF_NAME"
              exit 1
            fi
            RELEASE_VERSION="$CLEAN_VERSION"
          else
            echo "Release version is required"
            exit 1
          fi

          export RELEASE_VERSION
          node <<'NODE'
          const fs = require('node:fs')
          const version = process.env.RELEASE_VERSION
          for (const file of ['Cargo.toml', 'napi/Cargo.toml']) {
            const text = fs.readFileSync(file, 'utf8')
            fs.writeFileSync(file, text.replace(/^version = "([^"]+)"/m, `version = "${version}"`))
          }
          const file = 'napi/package.json'
          const json = JSON.parse(fs.readFileSync(file, 'utf8'))
          json.version = version
          fs.writeFileSync(file, `${JSON.stringify(json, null, 2)}\n`)
          NODE

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux)
        if: runner.os == 'Linux' && !contains(matrix.target, 'loongarch64') && matrix.target != 'riscv64gc-unknown-linux-musl'
        uses: taiki-e/install-action@cross

      - name: Install Zig (Linux zig targets)
        if: runner.os == 'Linux' && (contains(matrix.target, 'loongarch64') || matrix.target == 'riscv64gc-unknown-linux-musl')
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild (Linux zig targets)
        if: runner.os == 'Linux' && (contains(matrix.target, 'loongarch64') || matrix.target == 'riscv64gc-unknown-linux-musl')
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build (Linux cross)
        if: runner.os == 'Linux' && !contains(matrix.target, 'loongarch64') && matrix.target != 'riscv64gc-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (Linux zig)
        if: runner.os == 'Linux' && (contains(matrix.target, 'loongarch64') || matrix.target == 'riscv64gc-unknown-linux-musl')
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build (macOS / Windows)
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/sysproxy sysproxy-${{ matrix.output }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/${{ matrix.target }}/release/sysproxy.exe sysproxy-${{ matrix.output }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output }}
          path: sysproxy-${{ matrix.output }}*

  build-node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu  }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl  }
          - { os: ubuntu-latest,  target: riscv64gc-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: loongarch64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: riscv64gc-unknown-linux-musl }
          - { os: ubuntu-latest,  target: loongarch64-unknown-linux-musl }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: macos-latest,   target: aarch64-apple-darwin  }
          - { os: windows-latest, target: x86_64-pc-windows-msvc  }
          - { os: windows-latest, target: i686-pc-windows-msvc  }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Apply release package version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.version, 'v'))
        shell: bash
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"

          if [ -n "$INPUT_VERSION" ]; then
            CLEAN_VERSION="${INPUT_VERSION#v}"
            if [[ ! "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version format: $INPUT_VERSION"
              exit 1
            fi
            RELEASE_VERSION="$CLEAN_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            CLEAN_VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version format: $GITHUB_REF_NAME"
              exit 1
            fi
            RELEASE_VERSION="$CLEAN_VERSION"
          else
            echo "Release version is required"
            exit 1
          fi

          export RELEASE_VERSION
          node <<'NODE'
          const fs = require('node:fs')
          const version = process.env.RELEASE_VERSION
          for (const file of ['Cargo.toml', 'napi/Cargo.toml']) {
            const text = fs.readFileSync(file, 'utf8')
            fs.writeFileSync(file, text.replace(/^version = "([^"]+)"/m, `version = "${version}"`))
          }
          const file = 'napi/package.json'
          const json = JSON.parse(fs.readFileSync(file, 'utf8'))
          json.version = version
          fs.writeFileSync(file, `${JSON.stringify(json, null, 2)}\n`)
          NODE

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux)
        if: runner.os == 'Linux' && !contains(matrix.target, 'loongarch64') && matrix.target != 'riscv64gc-unknown-linux-musl'
        uses: taiki-e/install-action@cross

      - name: Install Zig (Linux zig targets)
        if: runner.os == 'Linux' && (contains(matrix.target, 'loongarch64') || matrix.target == 'riscv64gc-unknown-linux-musl')
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild (Linux zig targets)
        if: runner.os == 'Linux' && (contains(matrix.target, 'loongarch64') || matrix.target == 'riscv64gc-unknown-linux-musl')
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
        working-directory: napi

      - name: Build .node (Linux cross)
        if: runner.os == 'Linux' && !contains(matrix.target, 'loongarch64') && matrix.target != 'riscv64gc-unknown-linux-musl'
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }} --use-cross
        working-directory: napi

      - name: Build .node (Linux zig)
        if: runner.os == 'Linux' && (contains(matrix.target, 'loongarch64') || matrix.target == 'riscv64gc-unknown-linux-musl')
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }} --cross-compile
        working-directory: napi

      - name: Build .node (macOS / Windows)
        if: runner.os != 'Linux'
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }}
        working-directory: napi

      - name: Upload .node artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-${{ matrix.target }}
          path: napi/*.node

  pre-release:
    needs: [build, build-node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: main
          fetch-depth: 0

      - name: Update repository version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        shell: bash
        run: |
          CLEAN_VERSION="${{ github.event.inputs.version }}"
          CLEAN_VERSION="${CLEAN_VERSION#v}"
          if [[ ! "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: ${{ github.event.inputs.version }}"
            exit 1
          fi

          export CLEAN_VERSION
          node <<'NODE'
          const fs = require('node:fs')
          const version = process.env.CLEAN_VERSION
          for (const file of ['Cargo.toml', 'napi/Cargo.toml']) {
            const text = fs.readFileSync(file, 'utf8')
            fs.writeFileSync(file, text.replace(/^version = "([^"]+)"/m, `version = "${version}"`))
          }
          const packageFile = 'napi/package.json'
          const json = JSON.parse(fs.readFileSync(packageFile, 'utf8'))
          json.version = version
          fs.writeFileSync(packageFile, `${JSON.stringify(json, null, 2)}\n`)

          const lockPackages = new Set(['sysproxy', 'sysproxy-napi'])
          const lines = fs.readFileSync('Cargo.lock', 'utf8').split('\n')
          let inPackage = false
          let updatePackage = false
          for (let i = 0; i < lines.length; i += 1) {
            if (lines[i] === '[[package]]') {
              inPackage = true
              updatePackage = false
              continue
            }
            if (inPackage && lines[i].startsWith('name = ')) {
              updatePackage = lockPackages.has(lines[i].slice(8, -1))
              continue
            }
            if (inPackage && updatePackage && lines[i].startsWith('version = ')) {
              lines[i] = `version = "${version}"`
              updatePackage = false
              continue
            }
            if (inPackage && lines[i] === '') {
              inPackage = false
              updatePackage = false
            }
          }
          fs.writeFileSync('Cargo.lock', `${lines.join('\n').replace(/\n+$/, '')}\n`)
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock napi/Cargo.toml napi/package.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "update version to $CLEAN_VERSION"
          git push origin HEAD:main

      - name: Tag Repo
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        uses: richardsimko/update-tag@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          path: bin/
          merge-multiple: true

      - name: Delete current release assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: pre-release
          deleteOnlyFromDrafts: false

      - name: Tag Repo
        uses: richardsimko/update-tag@v1
        with:
          tag_name: pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Prerelease
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: pre-release
          files: bin/*
          prerelease: true

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.version, 'v'))
    needs: [build, build-node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bin/
          merge-multiple: true

      - name: Delete current release assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref }}
          deleteOnlyFromDrafts: false

      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref }}
          files: bin/*

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.version, 'v'))
    needs: [build-node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
        working-directory: napi

      - name: Set npm package version
        shell: bash
        working-directory: napi
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Create platform npm package dirs
        run: pnpm create-npm-dirs
        working-directory: napi

      - name: Download node artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: node-*
          path: napi/artifacts
          merge-multiple: true

      - name: Copy native artifacts into platform packages
        working-directory: napi
        run: pnpm artifacts

      - name: Verify native artifacts
        shell: bash
        working-directory: napi
        run: |
          for target in \
            linux-x64-gnu \
            linux-arm64-gnu \
            linux-x64-musl \
            linux-arm64-musl \
            linux-riscv64-gnu \
            linux-loong64-gnu \
            linux-riscv64-musl \
            linux-loong64-musl \
            darwin-x64 \
            darwin-arm64 \
            win32-x64-msvc \
            win32-ia32-msvc \
            win32-arm64-msvc; do
            test -f "npm/${target}/sysproxy.${target}.node"
            test -f "npm/${target}/package.json"
          done
          test -f index.js
          test -f index.d.ts
          test -f README.md

      - name: Publish platform npm packages
        run: pnpm exec napi pre-publish --tag-style npm --no-gh-release
        working-directory: napi
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify npm package contents
        shell: bash
        run: |
          npm pack --dry-run --json > pack.json
          node - <<'NODE'
          const fs = require('node:fs')
          const [{ files }] = JSON.parse(fs.readFileSync('pack.json', 'utf8'))
          const names = files.map((file) => file.path)
          if (names.some((name) => name.endsWith('.node'))) {
            throw new Error(`Main npm package must not include native binaries: ${names.join(', ')}`)
          }
          for (const required of ['index.js', 'index.d.ts', 'README.md', 'package.json']) {
            if (!names.includes(required)) {
              throw new Error(`Missing ${required} from main npm package`)
            }
          }
          NODE
        working-directory: napi

      - name: Publish npm package
        run: npm publish --ignore-scripts --access public --provenance
        working-directory: napi
