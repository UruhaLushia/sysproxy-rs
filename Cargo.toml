[workspace]
members = [".", "napi"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "sysproxy"
version = "0.2.7"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/UruhaLushia/sysproxy-rs"
description = "跨平台系统代理设置工具"
keywords = ["proxy", "system-proxy", "networksetup", "gsettings", "kioslaverc"]

[[bin]]
name = "sysproxy"
path = "src/main.rs"

[lib]
name = "sysproxy"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
ctrlc = "3"
pico-args = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["fs", "poll", "signal", "user", "process", "inotify"] }
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", features = ["event", "fs", "net", "user", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinInet",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
